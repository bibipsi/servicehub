spring.datasource.url=jdbc:h2:mem:servicehub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# As mesmas migrações Flyway da aplicação criam o banco H2; o Hibernate apenas valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
servicehub.jwt.secret=chave-de-teste-com-pelo-menos-32-bytes-para-hs256
servicehub.jwt.expiracao=15m
servicehub.jwt.emissor=servicehub-api
servicehub.admin.email=
servicehub.admin.senha=
