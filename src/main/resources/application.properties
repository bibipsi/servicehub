spring.application.name=servicehub-api

# Banco de dados (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/servicehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate: a estrutura do banco é criada pelo Flyway e apenas validada pelo Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway: bancos que já possuem a tabela servicos (criada pelo antigo ddl-auto=update)
# são registrados na versão 1 e recebem apenas as migrações seguintes
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT: a chave padrão serve apenas para desenvolvimento local; em outros ambientes defina JWT_SECRET
servicehub.jwt.secret=${JWT_SECRET:servicehub-chave-de-desenvolvimento-local-troque-em-producao}
servicehub.jwt.expiracao=${JWT_EXPIRATION:1h}
servicehub.jwt.emissor=servicehub-api

# Administrador inicial (criado somente se as duas variáveis estiverem definidas)
servicehub.admin.email=${ADMIN_EMAIL:}
servicehub.admin.senha=${ADMIN_PASSWORD:}

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
