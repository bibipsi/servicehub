services:
  postgres:
    image: postgres:17
    container_name: servicehub-postgres
    environment:
      POSTGRES_DB: servicehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d servicehub"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - servicehub-data:/var/lib/postgresql/data

volumes:
  servicehub-data:
